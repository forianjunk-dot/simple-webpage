name: test Webpage Actions
run-name: ${{ github.actor }} is testing out GitHub Actions
on: [push]
jobs:
  HTMLHint:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g htmlhint
      - run: htmlhint "**/*.html"
  lychee:
    runs-on: ubuntu-latest
    container:
      image: lycheeverse/lychee:master
    steps:
      - uses: actions/checkout@v4
      - run: lychee .
  eslint:
    runs-on: ubuntu-latest
    container:
      image: pipelinecomponents/eslint:edge
    steps:
      - uses: actions/checkout@v4
      - run: |
          eslint --ext .html,.js src


